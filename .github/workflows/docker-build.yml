name: build-and-push-ctx128k-mmproj

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  IMAGE_NAME: gotyou6004/qwen36-llamacpp

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: gotyou6004
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:ctx128k-mmproj
